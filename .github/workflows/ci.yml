name: CI

on:
  push:
    branches: [main, research-hardening, v2-research-rebuild]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,lint]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow and not octave"

  statistical-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GNU Octave (runs the original v0.1 MATLAB script)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: pip install -e ".[dev]"
      - run: pytest -m "slow or octave" --cov=stochplace --cov-report=term

  smoke-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: stochplace run configs/suite_drift.yaml configs/data_scarcity.yaml --seeds 2 --workers 2 --out /tmp/smoke
      - run: python scripts/approximation_study.py --instances 3 --out /tmp/smoke/approximation
      - run: stochplace robustness --seeds 1 --workers 2 --out /tmp/smoke/robustness --figures /tmp/smoke/figures
      - run: python examples/quickstart.py

  result-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_artifacts.py
      - run: python scripts/compare_summaries.py --base 3b8548d
      - run: python scripts/compare_summaries.py --base 2c5fe28f46f0b8e748784680f5fcc1517edcb92a
      - name: Regenerate reported tables without changing tracked outputs
        run: |
          python scripts/ais_bandwidth_sensitivity.py --render-only --readme README.md
          python scripts/research_extensions_summary.py
          python scripts/presentation_summary.py --check
          git diff --exit-code -- README.md docs/tables docs/research_results.md paper/extension_results.tex paper/ais_sensitivity_numbers.tex results/calibration_diagnostics.csv
      - name: Research runner smoke checks
        run: |
          stochplace run configs/holdout_random_walk.yaml --seeds 1 --workers 1 --out /tmp/research-smoke
          python scripts/transport_study.py --config tests/fixtures/transport_smoke.yaml --workers 1 --out /tmp/research-smoke/transport
