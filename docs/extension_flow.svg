<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" fill="#0b0b0b"/><style>.t{font:600 22px Arial,sans-serif;fill:#f1f1f1}.s{font:15px Arial,sans-serif;fill:#aaaaaa}.b{fill:#161616;stroke:#555;stroke-width:2}.a{stroke:#aaa;stroke-width:2;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#aaa"/></marker></defs><text x="50" y="55" class="t">Source framework → proposed extension → toy simulation</text><rect x="55" y="110" rx="8" ry="8" width="250" height="125" class="b"/><text x="80" y="145" class="t">Kim et al.</text><text x="80" y="177" class="s">Historical stochastic routes</text><text x="80" y="202" class="s">Representation space + placement</text><rect x="475" y="90" rx="8" ry="8" width="250" height="165" class="b"/><text x="500" y="125" class="t">Proposed extension</text><text x="500" y="157" class="s">Future-route shift</text><text x="500" y="182" class="s">Trajectory uncertainty</text><text x="500" y="207" class="s">Extended intensity concept</text><text x="500" y="232" class="s">Condition-aware placement</text><rect x="895" y="110" rx="8" ry="8" width="250" height="125" class="b"/><text x="920" y="145" class="t">TOY SIMULATION</text><text x="920" y="177" class="s">Synthetic straight-line routes</text><text x="920" y="202" class="s">Gaussian maps + greedy sensors</text><path d="M305 172 H462" class="a"/><path d="M725 172 H882" class="a"/><text x="50" y="315" class="s">VERY BASIC EXPERIMENT — illustrative only; not a reproduction of the full LGCLP/INLA method and not experimental validation.</text></svg>