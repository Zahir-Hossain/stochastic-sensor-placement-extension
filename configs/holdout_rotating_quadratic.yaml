name: holdout_rotating_quadratic
description: Preregistered out-of-family test; report all outcomes.
scenario: rotating_quadratic
scenario_params: {}
history_epochs: 8
horizons:
- 2
seeds: 40
n_sensors: 4
sensor:
  type: gaussian
  rho: 0.95
  r: 1.0
grid:
  n_alpha: 120
  n_p: 64
eval_grid:
  n_alpha: 360
  n_p: 192
lgcp_fit_shape:
- 60
- 32
candidate_spacing: 1.0
beta: 0.9
strategies:
- pooled
- recent
- drift_u
- trend
- stacked
- pseudo_bma
- oracle
vary_scenario_seed: true
