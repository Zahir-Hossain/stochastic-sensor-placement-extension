name: suite_emergence
description: Full strategy comparison on the emergence scenario (horizon 2).
scenario: emergence
history_epochs: 8
horizons: [2]
seeds: 40
n_sensors: 4
sensor: {type: gaussian, rho: 0.95, r: 1.0}
grid: {n_alpha: 120, n_p: 64}
eval_grid: {n_alpha: 360, n_p: 192}
lgcp_fit_shape: [60, 32]
candidate_spacing: 1.0
beta: 0.9
strategies:
  - pooled
  - lgcp
  - recent
  - drift
  - drift_u
  - "drift_u:void"
  - "drift_u:cvar"
  - trend
  - "trend:cvar"
  - mixture
  - pseudo_bma
  - stacked
  - "stacked:void"
  - "stacked:cvar"
  - oracle
  - fence
  - random
